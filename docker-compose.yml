services:
  api:
    build: .
    container_name: recetas-llm-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: recetas-llm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-generador-recetas-llm-db}
      POSTGRES_USER: ${POSTGRES_USER:-recetas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recetas_password_dev}
    ports:
      - "5432:5432"
    volumes:
      - recetas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  recetas_postgres_data:
